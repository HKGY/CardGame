<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>残响之塔 · 卡牌爬塔</title>
  <link rel="stylesheet" href="css/style.css?v=76">
</head>
<body>
  <!-- 内联定位作兜底：即使样式表被浏览器缓存成旧版，画布也不会挤出空白条 -->
  <div id="scene-bg" style="position:fixed;inset:0;z-index:-2;pointer-events:none"></div>
  <canvas id="bg-canvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none"></canvas>
  <div id="app">
    <!-- 开始菜单 -->
    <section id="screen-menu" class="screen">
      <div class="menu">
        <h1 class="menu-title">残响之塔</h1>
        <p class="menu-sub">Echoing Spire · 卡牌爬塔</p>
        <div class="menu-story">
          <p>魔族大军压境，王国危在旦夕。传说古代遗迹的高塔之巅，封存着足以扭转战局的「古代遗物」。</p>
          <p>身为王国第一女骑士，你自请前往。塔中盘踞的魔物正是入侵的先锋——清剿它们，也是替前线分忧。</p>
          <p>你握着一副最朴素的牌，踏入第一层。用你的牌组、运气与抉择，一层层向上——去取回那件传说之物。</p>
        </div>
        <input id="seed-input" class="seed-input" type="text" maxlength="24" placeholder="🌱 随机种子（留空则随机）" autocomplete="off">
        <!-- 调试：手动开关本局卡包（默认全关，至少开 1 个才能开始）；内容由 screens.js 填充 -->
        <div id="menu-debug" class="menu-debug"></div>
        <div class="menu-actions">
          <button id="menu-start" class="big-btn menu-start">⚔️ 开始攀登</button>
          <button id="menu-codex" class="big-btn">📖 百科</button>
        </div>
      </div>
    </section>

    <!-- 顶栏：跑图信息（战斗时隐藏） -->
    <header id="run-header" class="run-header">
      <div class="run-title">🗼 第 <span id="run-act">1</span> / 3 层</div>
      <div class="run-stats">
        <span id="run-seed" class="run-seed" title="本局随机种子"></span>
        <span id="run-hp">❤️ 0/0</span>
        <span id="run-gold">💰 0</span>
        <span id="run-potions" class="run-potions" title="消耗品栏"></span>
        <span id="run-relics" class="run-relics" title="遗物"></span>
        <button id="bench-btn" title="宝石工作台（免费镶嵌）">💎 宝石 <b>0</b></button>
        <button id="codex-btn">📖 百科</button>
        <button id="run-deck-btn">🂠 牌库</button>
        <button id="debug-btn" title="调试菜单：把自定义宝石加入背包">🐞 调试</button>
        <button id="mute-btn" class="mute-btn" title="音效开关">🔊</button>
      </div>
    </header>

    <!-- ===== 地图 ===== -->
    <section id="screen-map" class="screen">
      <p id="map-subtitle" class="map-hint"></p>
      <div class="map-wrap"><div id="map-area" class="map-grid"></div></div>
      <div class="tarot-bar" id="map-tarot-bar"></div>
    </section>

    <!-- ===== 战斗 ===== -->
    <section id="screen-battle" class="screen">
      <div class="battle-topbar">
        <div id="battle-minimap" class="battle-minimap" title="本层地图（略缩）"></div>
        <span id="battle-relics" class="run-relics"></span>
        <div class="topbar-btns">
          <button id="mute-btn-2" class="mute-btn" title="音效开关">🔊</button>
          <button id="codex-btn-2">📖 百科</button>
          <button id="view-deck">🂠 本场牌库</button>
        </div>
      </div>

      <div class="battlefield">
        <div class="flank flank-left"><div class="tarot-bar" id="tarot-bar"></div></div>
        <div class="arena">
          <div class="combatant side-player">
            <div class="info" id="player-info"></div>
            <div class="stage" id="player-stage"><div class="sprite" id="player-sprite"></div></div>
          </div>
          <div class="enemy-group side-enemy" id="enemy-group"></div>
        </div>
        <div class="flank flank-right"><div class="log" id="log"></div></div>
      </div>

      <!-- 底部：能量(左下) / 手牌 / 结束回合(右下) 左右对称 -->
      <div class="board">
        <div class="board-side board-side-left">
          <div class="energy" id="energy"></div>
          <div class="pile" id="draw-pile" title="点击查看抽牌堆"></div>
        </div>
        <div class="hand" id="hand"></div>
        <div class="board-side">
          <button id="debug-win" class="debug-win" title="调试：直接赢得本场战斗">🏆 赢得战斗</button>
          <button id="end-turn" class="end-turn">结束回合</button>
          <div class="pile" id="discard-pile" title="点击查看弃牌堆"></div>
        </div>
      </div>
    </section>

    <!-- ===== 其它屏（内容由 JS 填充） ===== -->
    <section id="screen-reward" class="screen"></section>
    <section id="screen-shop" class="screen"></section>
    <section id="screen-event" class="screen"></section>
    <section id="screen-gameover" class="screen"></section>

    <!-- 牌堆 / 牌库查看弹窗（战斗与跑图通用） -->
    <div id="pile-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head"><h3 id="pile-title"></h3><button id="pile-close">关闭</button></div>
        <div id="pile-cards" class="modal-cards"></div>
      </div>
    </div>

    <!-- 选牌弹窗（升级 / 删牌 / 魔术师等） -->
    <div id="picker-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head"><h3 id="picker-title"></h3><button id="picker-close">取消</button></div>
        <div id="picker-cards" class="modal-cards"></div>
      </div>
    </div>

    <!-- 三选一弹窗（太阳） -->
    <div id="choice-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head"><h3 id="choice-title"></h3><button id="choice-close">取消</button></div>
        <div id="choice-options" class="choice-options"></div>
      </div>
    </div>

    <!-- 宝石工作台（免费镶嵌：选背包宝石 → 选有空孔的卡） -->
    <div id="bench-modal" class="modal hidden">
      <div class="modal-box bench-box">
        <div class="modal-head"><h3>💎 宝石工作台 · 镶嵌免费</h3><button id="bench-close">关闭</button></div>
        <div id="bench-body" class="bench-body"></div>
      </div>
    </div>

    <!-- 调试菜单：构建一颗任意词条的宝石并加入背包（词条按主题分类便于查找） -->
    <div id="debug-modal" class="modal hidden">
      <div class="modal-box debug-box">
        <div class="modal-head"><h3>🐞 调试 · 自定义宝石</h3><button id="debug-close">关闭</button></div>
        <div id="debug-body" class="debug-body"></div>
      </div>
    </div>

    <!-- 百科大全 -->
    <div id="codex-modal" class="modal hidden">
      <div class="modal-box codex-box">
        <div class="modal-head"><h3>📖 百科大全</h3><button id="codex-close">关闭</button></div>
        <div class="codex-tabs">
          <button class="codex-tab" id="codex-tab-affix">词条</button>
          <button class="codex-tab" id="codex-tab-pack">卡包</button>
          <button class="codex-tab" id="codex-tab-tarot">消耗品</button>
          <button class="codex-tab" id="codex-tab-relic">遗物</button>
          <button class="codex-tab" id="codex-tab-enemy">敌人</button>
        </div>
        <div id="codex-body" class="codex-body"></div>
      </div>
    </div>
  </div>

  <!-- 加载顺序：数据 -> 引擎 -> 贴图/界面 -> 入口（都挂在 window.CG 上） -->
  <script src="js/util/rng.js?v=76"></script>
  <script src="js/data/cards.js?v=76"></script>
  <script src="js/data/affixes.js?v=76"></script>
  <script src="js/data/tarot.js?v=76"></script>
  <script src="js/data/relics.js?v=76"></script>
  <script src="js/data/config.js?v=76"></script>
  <script src="js/data/enemies.js?v=76"></script>
  <script src="js/engine/effects.js?v=76"></script>
  <script src="js/engine/game.js?v=76"></script>
  <script src="js/engine/run.js?v=76"></script>
  <script src="js/ui/sprites.js?v=76"></script>
  <script src="js/ui/audio.js?v=76"></script>
  <script src="js/ui/music.js?v=76"></script>
  <script src="js/ui/background.js?v=76"></script>
  <script src="js/ui/render.js?v=76"></script>
  <script src="js/ui/screens.js?v=76"></script>
  <script src="js/main.js?v=76"></script>
</body>
</html>
