<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>残响之塔 · 卡牌爬塔</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <!-- 内联定位作兜底：即使样式表被浏览器缓存成旧版，画布也不会挤出空白条 -->
  <canvas id="bg-canvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none"></canvas>
  <div id="app">
    <!-- 开始菜单 -->
    <section id="screen-menu" class="screen">
      <div class="menu">
        <h1 class="menu-title">残响之塔</h1>
        <p class="menu-sub">Echoing Spire · 卡牌爬塔</p>
        <div class="menu-story">
          <p>世界尽头，凭空耸立着一座名为「残响之塔」的尖塔。塔身回荡着历代挑战者的残念——他们都曾妄图登顶，却无一生还。</p>
          <p>传说塔顶封存着能改写命运的「初火」。你握着一副最朴素的牌，踏入第一层。</p>
          <p>每一层都有更凶险的守望者，也散落着遗物与塔罗的指引。用你的牌组、运气与抉择，一层层向上——直至面对塔顶的真相。</p>
        </div>
        <div class="menu-actions">
          <button id="menu-start" class="big-btn menu-start">⚔️ 开始攀登</button>
          <button id="menu-codex" class="big-btn">📖 百科</button>
        </div>
      </div>
    </section>

    <!-- 顶栏：跑图信息（战斗时隐藏） -->
    <header id="run-header" class="run-header">
      <div class="run-title">🗼 第 <span id="run-act">1</span> 层</div>
      <div class="run-stats">
        <span id="run-hp">❤️ 0/0</span>
        <span id="run-gold">💰 0</span>
        <span id="run-potions" class="run-potions" title="消耗品栏"></span>
        <span id="run-relics" class="run-relics" title="遗物"></span>
        <button id="codex-btn">📖 百科</button>
        <button id="run-deck-btn">🂠 牌库</button>
        <button id="mute-btn" class="mute-btn" title="音效开关">🔊</button>
      </div>
    </header>

    <!-- ===== 地图 ===== -->
    <section id="screen-map" class="screen">
      <p class="map-hint">点击发光节点前进。⚔️战斗　💀精英　🛒商店　🏕️休息　🔮事件　👑首领</p>
      <div class="map-wrap"><div id="map-area" class="map-area"></div></div>
      <div class="tarot-bar" id="map-tarot-bar"></div>
    </section>

    <!-- ===== 战斗 ===== -->
    <section id="screen-battle" class="screen">
      <div class="battle-topbar">
        <span id="battle-relics" class="run-relics"></span>
        <div class="topbar-btns">
          <button id="mute-btn-2" class="mute-btn" title="音效开关">🔊</button>
          <button id="codex-btn-2">📖 百科</button>
          <button id="view-deck">🂠 本场牌库</button>
        </div>
      </div>

      <div class="battlefield">
        <div class="side side-player">
          <div class="stage" id="player-stage"><div class="sprite" id="player-sprite"></div></div>
          <div class="info" id="player-info"></div>
        </div>
        <div class="versus">VS</div>
        <div class="side side-enemy">
          <div class="stage" id="enemy-stage"><div class="sprite" id="enemy-sprite"></div></div>
          <div class="info" id="enemy-info"></div>
        </div>
      </div>

      <div class="board">
        <div class="pile" id="draw-pile" title="点击查看抽牌堆"></div>
        <div class="hand" id="hand"></div>
        <div class="pile" id="discard-pile" title="点击查看弃牌堆"></div>
      </div>

      <div class="tarot-bar" id="tarot-bar"></div>

      <div class="controls">
        <div class="energy" id="energy"></div>
        <button id="end-turn" class="end-turn">结束回合</button>
      </div>

      <div class="log" id="log"></div>
    </section>

    <!-- ===== 其它屏（内容由 JS 填充） ===== -->
    <section id="screen-reward" class="screen"></section>
    <section id="screen-shop" class="screen"></section>
    <section id="screen-rest" class="screen"></section>
    <section id="screen-event" class="screen"></section>
    <section id="screen-gameover" class="screen"></section>

    <!-- 牌堆 / 牌库查看弹窗（战斗与跑图通用） -->
    <div id="pile-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head"><h3 id="pile-title"></h3><button id="pile-close">关闭</button></div>
        <div id="pile-cards" class="modal-cards"></div>
      </div>
    </div>

    <!-- 选牌弹窗（升级 / 删牌 / 魔术师等） -->
    <div id="picker-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head"><h3 id="picker-title"></h3><button id="picker-close">取消</button></div>
        <div id="picker-cards" class="modal-cards"></div>
      </div>
    </div>

    <!-- 三选一弹窗（太阳） -->
    <div id="choice-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head"><h3 id="choice-title"></h3><button id="choice-close">取消</button></div>
        <div id="choice-options" class="choice-options"></div>
      </div>
    </div>

    <!-- 百科大全 -->
    <div id="codex-modal" class="modal hidden">
      <div class="modal-box codex-box">
        <div class="modal-head"><h3>📖 百科大全</h3><button id="codex-close">关闭</button></div>
        <div class="codex-tabs">
          <button class="codex-tab" id="codex-tab-affix">词条</button>
          <button class="codex-tab" id="codex-tab-tarot">消耗品</button>
          <button class="codex-tab" id="codex-tab-relic">遗物</button>
          <button class="codex-tab" id="codex-tab-enemy">敌人</button>
        </div>
        <div id="codex-body" class="codex-body"></div>
      </div>
    </div>
  </div>

  <!-- 加载顺序：数据 -> 引擎 -> 贴图/界面 -> 入口（都挂在 window.CG 上） -->
  <script src="js/data/cards.js?v=8"></script>
  <script src="js/data/affixes.js?v=8"></script>
  <script src="js/data/tarot.js?v=8"></script>
  <script src="js/data/relics.js?v=8"></script>
  <script src="js/data/config.js?v=8"></script>
  <script src="js/data/enemies.js?v=8"></script>
  <script src="js/engine/effects.js?v=8"></script>
  <script src="js/engine/game.js?v=8"></script>
  <script src="js/engine/run.js?v=8"></script>
  <script src="js/ui/sprites.js?v=8"></script>
  <script src="js/ui/audio.js?v=8"></script>
  <script src="js/ui/background.js?v=8"></script>
  <script src="js/ui/render.js?v=8"></script>
  <script src="js/ui/screens.js?v=8"></script>
  <script src="js/main.js?v=8"></script>
</body>
</html>
